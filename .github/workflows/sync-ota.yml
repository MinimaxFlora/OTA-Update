```yaml
name: 🔄 Sync OpenWrt OTA

on:
  # 手动执行
  workflow_dispatch:

  # 每小时检查一次上游最新 Release
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  sync:
    name: 📥 同步最新 ota.json
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v5

      - name: 🔎 获取最新 Release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          API_URL="https://api.github.com/repos/MinimaxFlora/My-OpenWrt-Firmware/releases/latest"

          RELEASE_JSON=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL")

          TAG_NAME=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          OTA_URL=$(echo "$RELEASE_JSON" | jq -r \
            '.assets[] | select(.name == "ota.json") | .browser_download_url')

          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "null" ]; then
            echo "❌ 无法获取最新 Release Tag"
            exit 1
          fi

          if [ -z "$OTA_URL" ] || [ "$OTA_URL" = "null" ]; then
            echo "❌ 最新 Release 中没有 ota.json"
            exit 1
          fi

          echo "✅ 最新 Tag: $TAG_NAME"
          echo "✅ ota.json: $OTA_URL"

          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "ota_url=$OTA_URL" >> "$GITHUB_OUTPUT"

      - name: 📥 下载最新 ota.json
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p openwrt-25.12

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 10 \
            --max-time 60 \
            "${{ steps.release.outputs.ota_url }}" \
            -o openwrt-25.12/ota.json

          echo "📄 ota.json 内容："
          cat openwrt-25.12/ota.json

      - name: ✅ 校验 JSON
        shell: bash
        run: |
          set -euo pipefail

          jq empty openwrt-25.12/ota.json

          echo "✅ JSON 格式正确"

      - name: 🔍 检查文件变化
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- openwrt-25.12/ota.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ ota.json 没有变化"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "🔄 ota.json 已更新"
          fi

      - name: 📝 提交更新
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add openwrt-25.12/ota.json

          git commit \
            -m "chore: sync OpenWrt OTA ${{ steps.release.outputs.tag }}"

          git push

      - name: 📊 输出结果
        shell: bash
        run: |
          echo "======================================"
          echo "✅ OpenWrt OTA 同步完成"
          echo "🏷️ Release: ${{ steps.release.outputs.tag }}"
          echo "📄 文件: openwrt-25.12/ota.json"
          echo "🌐 URL: https://api.kejizero.xyz/openwrt-25.12/ota.json"
          echo "======================================"
```
